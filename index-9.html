<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artmerce | ديكورات منزلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@1,600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --blush:#ebebea;      /* رمادي ضبابي */
    --rose:#5e5e5e;       /* رمادي فحمي */
    --rose-deep:#111111;  /* أسود */
    --plum:#161616;
    --cream:#f7f7f6;      /* أبيض لؤلؤي */
    --gold:#a8a8a8;       /* فضي */
    --line:rgba(0,0,0,0.12);
    --silver:linear-gradient(100deg,#0b0b0b 0%,#4a4a4a 38%,#bdbdbd 52%,#4a4a4a 66%,#0b0b0b 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--plum);
    font-family:'Tajawal',sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}

  header{
    position:sticky;top:0;z-index:50;
    background:rgba(247,247,246,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:18px 6vw;
    display:flex;align-items:center;justify-content:center;
    position:sticky;
  }
  .cart-btn{
    position:absolute; left:6vw; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:50%;
    background:var(--blush); cursor:pointer;
  }
  .cart-btn svg{ width:20px; height:20px; }
  .cart-badge{
    position:absolute; top:-4px; right:-4px;
    background:var(--rose-deep); color:#fff; font-size:10px; font-weight:700;
    min-width:17px; height:17px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .brand{
    font-family:'Cormorant Garamond',serif;
    font-weight:600; font-style:italic;
    font-size:clamp(32px,5vw,46px);
    line-height:1.1; letter-spacing:1.5px;
    direction:ltr;
    background:var(--silver); background-size:220% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation:sheen 6s ease-in-out infinite alternate;
  }
  @keyframes sheen{ from{background-position:0% 0;} to{background-position:100% 0;} }
  @media (prefers-reduced-motion:reduce){ .brand{animation:none;} }

  .hero{
    position:relative;
    padding:90px 6vw 70px;
    text-align:center;
    background:
      radial-gradient(circle at 85% 0%, rgba(255,255,255,0.16) 0%, transparent 50%),
      linear-gradient(180deg,#0c0c0c 0%,#1f1f1f 55%,#3b3b3b 100%);
    margin-top:24px;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 100% 48px;
    opacity:1;
    pointer-events:none;
  }
  .hero h1{
    font-family:'Aref Ruqaa',serif;
    font-size:clamp(34px,6vw,60px);
    color:#fff;
    position:relative;
    margin-bottom:14px;
  }
  .hero p{
    font-size:clamp(15px,2vw,18px);
    color:#bdbdbd;
    max-width:520px;
    margin:0 auto;
    position:relative;
  }
  .hero .rule{
    width:90px;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);
    margin:26px auto 0;border-radius:2px;
    position:relative;
  }
  .shipping-line{
    text-align:center; font-size:13px; color:var(--rose-deep);
    padding:14px 6vw 0;
  }
  .shipping-line span{ background:#fff; border:1px solid var(--line); padding:6px 16px; border-radius:999px; }


  .gallery-wrap{ padding:50px 0 100px; }
  .gallery{
    display:flex;
    flex-direction:column;
    gap:56px;
    max-width:600px;
    margin:0 auto;
  }
  .card{
    background:var(--blush);
    border-radius:0;
    overflow:hidden;
    position:relative;
    box-shadow:0 8px 28px rgba(0,0,0,0.08);
    transition:transform .35s ease, box-shadow .35s ease;
  }
  .card:hover{ transform:translateY(-4px); box-shadow:0 18px 38px rgba(0,0,0,0.16); }
  .card .imgbox{
    aspect-ratio:1/1;
    background:#dedede;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    cursor:zoom-in;
  }
  .card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card .placeholder{ color:#8c8c8c; font-size:14px; }
  .card .dots{ position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:2; }
  .card .dots span{ width:6px;height:6px;border-radius:50%; background:rgba(255,255,255,0.55); }
  .card .dots span.on{ background:#fff; }
  .card .arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:34px;height:34px;border-radius:50%; background:rgba(255,255,255,0.75);
    display:flex;align-items:center;justify-content:center; font-size:17px; color:var(--rose-deep);
    z-index:2; cursor:pointer;
  }
  .card .arrow.prev{ right:10px; }
  .card .arrow.next{ left:10px; }
  .card .info{
    padding:20px 22px 24px;
    display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(0,0,0,0.08);
    gap:10px;
  }
  .card .name{ font-weight:700; font-size:17px; color:var(--plum); }
  .card-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .add-cart-btn{
    flex-shrink:0; width:38px; height:38px; border-radius:50%;
    background:var(--rose-deep); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s ease;
  }
  .add-cart-btn:active{ transform:scale(0.9); }
  .add-cart-btn svg{ width:17px; height:17px; }
  .share-btn{
    flex-shrink:0; width:38px; height:38px; border-radius:50%;
    background:#fff; border:1px solid var(--line); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s ease;
  }
  .share-btn:active{ transform:scale(0.9); }
  .share-btn svg{ width:16px; height:16px; }
  .card .price{
    font-family:'Aref Ruqaa',serif;
    font-size:22px;
    color:var(--rose-deep);
    background:var(--cream);
    padding:3px 14px;
    border-radius:999px;
    border:1px solid var(--gold);
  }
  .empty-msg{
    text-align:center;
    color:#8a8a8a;
    padding:60px 0;
    font-size:15px;
  }

  /* ===== Lightbox ===== */
  .lightbox{
    position:fixed; inset:0; z-index:200;
    background:rgba(10,10,10,0.94);
    display:none; align-items:center; justify-content:center;
    padding:24px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:100%; max-height:88vh;
    border-radius:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .lightbox .close{
    position:absolute; top:18px; left:18px;
    width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    color:#fff; font-size:22px; line-height:42px; text-align:center;
    cursor:pointer;
  }

  /* ===== Cart drawer ===== */
  .cart-overlay{
    position:fixed; inset:0; z-index:250; background:rgba(10,10,10,0.55);
    display:none;
  }
  .cart-overlay.open{ display:block; }
  .cart-drawer{
    position:fixed; top:0; left:0; height:100%; width:88%; max-width:380px;
    background:var(--cream); z-index:251;
    display:flex; flex-direction:column;
    transform:translateX(-105%); transition:transform .3s ease;
    box-shadow:8px 0 30px rgba(0,0,0,0.2);
  }
  .cart-drawer.open{ transform:translateX(0); }
  .cart-head{
    padding:20px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .cart-head h2{ font-family:'Aref Ruqaa',serif; font-size:22px; color:var(--rose-deep); }
  .cart-head .close-cart{ cursor:pointer; font-size:20px; color:var(--plum); }
  .cart-items{ flex:1; overflow-y:auto; padding:16px 20px; }
  .cart-empty{ text-align:center; color:#8a8a8a; padding:40px 0; font-size:14px; }
  .cart-item{
    display:flex; align-items:center; gap:12px; padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-item img{ width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--blush); }
  .cart-item .ci-info{ flex:1; }
  .cart-item .ci-name{ font-size:14px; font-weight:700; }
  .cart-item .ci-price{ font-size:13px; color:var(--rose-deep); }
  .cart-qty{ display:flex; align-items:center; gap:8px; }
  .cart-qty button{
    width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
    background:#fff; font-size:14px; cursor:pointer; line-height:1;
  }
  .cart-qty span{ font-size:13px; min-width:16px; text-align:center; }
  .cart-remove{ color:var(--rose-deep); font-size:12px; text-decoration:underline; cursor:pointer; margin-right:6px; }
  .cart-foot{ padding:18px 20px; border-top:1px solid var(--line); }
  .cart-total{ display:flex; justify-content:space-between; font-weight:700; margin-bottom:14px; font-size:15px; }
  .cart-checkout{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px; border:none; border-radius:12px;
    background:#111; color:#fff; font-family:'Tajawal',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer;
  }

  footer{
    background:linear-gradient(180deg,#1c1c1c,#0a0a0a);
    color:#dcdcdc;
    text-align:center;
    padding:34px 6vw 30px;
    font-size:14px;
  }
  footer .fbrand{ font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:34px; letter-spacing:1.5px; margin-bottom:6px; color:#fff; direction:ltr; }
  footer .contact{ opacity:0.85; margin-top:6px; direction:ltr; display:inline-block; }
  footer .admin-link{
    display:block;margin-top:16px;font-size:12px;opacity:0.55;
  }

  .wa-float{
    position:fixed;
    bottom:22px; left:22px;
    width:52px;height:52px;
    background:#111;
    border:1px solid rgba(255,255,255,0.35);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    z-index:100;
    transition:transform .25s ease;
  }
  .wa-float:hover{ transform:scale(1.08); }
  .wa-float svg{ width:26px; height:26px; }

  @media (max-width:480px){
    .gallery{gap:38px;}
    .card .name{font-size:15px;}
    .card .price{font-size:18px;}
  }

  /* ===== Hero slideshow ===== */
  .hero-slides-wrap{ padding:24px 6vw 0; }
  .hero-slides-wrap:has(#heroSlides[style*='none']){ display:none; }
  .hero-slides-wrap:has(#heroSlides[style*='none']) + .hero{ margin-top:0; }
  .hero-slides{
    position:relative; width:100%; max-width:420px; margin:0 auto;
    aspect-ratio:1/1; border-radius:22px; overflow:hidden;
    background:var(--blush); box-shadow:0 8px 28px rgba(0,0,0,0.08);
  }
  .hero-slides img, .hero-slides video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity 1.1s ease;
  }
  .hero-slides img.active, .hero-slides video.active{ opacity:1; }
  .hero-slides .dots{
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; z-index:2;
  }
  .hero-slides .dots span{ width:6px;height:6px;border-radius:50%; background:rgba(255,255,255,0.55); }
  .hero-slides .dots span.on{ background:#fff; }
</style>
</head>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA-4n4iV2_Gx3FvdSeI9ylDcIDS_-E5los",
    authDomain: "ranasin.firebaseapp.com",
    projectId: "ranasin",
    storageBucket: "ranasin.firebasestorage.app",
    messagingSenderId: "86337997894",
    appId: "1:86337997894:web:9edd6462c5ff1fb57c0e47"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ===== Hero slideshow =====
  db.collection('settings').doc('hero').onSnapshot(doc => {
    const data = doc.exists ? doc.data() : {};
    const images = data.images || [];
    const videoUrl = data.video || '';
    const wrap = document.getElementById('heroSlides');
    const dotsBar = document.getElementById('heroDots');
    const videoEl = document.getElementById('heroVideo');
    clearInterval(window._heroTimer);

    if (videoUrl) {
      wrap.style.display = 'block';
      wrap.querySelectorAll('img').forEach(el => el.remove());
      dotsBar.innerHTML = '';
      videoEl.src = videoUrl;
      videoEl.style.display = 'block';
      videoEl.classList.add('active');
      return;
    }
    videoEl.style.display = 'none';
    videoEl.classList.remove('active');

    if (images.length === 0) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    wrap.querySelectorAll('img').forEach(el => el.remove());
    dotsBar.innerHTML = '';
    images.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      if (i === 0) img.classList.add('active');
      wrap.insertBefore(img, dotsBar);
      const dot = document.createElement('span');
      if (i === 0) dot.classList.add('on');
      dotsBar.appendChild(dot);
    });
    if (images.length > 1) {
      let idx = 0;
      const imgs = wrap.querySelectorAll('img');
      const dots = dotsBar.querySelectorAll('span');
      clearInterval(window._heroTimer);
      function tick(){
        imgs[idx].classList.remove('active');
        dots[idx].classList.remove('on');
        idx = (idx + 1) % imgs.length;
        imgs[idx].classList.add('active');
        dots[idx].classList.add('on');
      }
      window._heroTimer = setInterval(tick, 3000);
      const pause = () => clearInterval(window._heroTimer);
      const resume = () => { clearInterval(window._heroTimer); window._heroTimer = setInterval(tick, 3000); };
      wrap.onmousedown = pause;
      wrap.onmouseup = resume;
      wrap.onmouseleave = resume;
      wrap.ontouchstart = pause;
      wrap.ontouchend = resume;
      wrap.ontouchcancel = resume;
    }
  });

  const gallery = document.getElementById('gallery');

  db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
    if (snapshot.empty) {
      gallery.innerHTML = '<div class="empty-msg">سيتم عرض المنتجات هنا قريبًا</div>';
      return;
    }
    gallery.innerHTML = '';
    snapshot.forEach(doc => {
      const p = doc.data();
      const images = (p.images && p.images.length) ? p.images : (p.image ? [p.image] : []);
      const card = document.createElement('div');
      card.className = 'card';

      let imgHtml = images.length
        ? `<img src="${images[0]}" alt="${p.name}">`
        : '<span class="placeholder">لا توجد صورة</span>';
      let dotsHtml = '';
      let arrowsHtml = '';
      if (images.length > 1) {
        dotsHtml = `<div class="dots">${images.map((_, i) => `<span class="${i === 0 ? 'on' : ''}"></span>`).join('')}</div>`;
        arrowsHtml = `<div class="arrow prev">‹</div><div class="arrow next">›</div>`;
      }

      card.innerHTML = `
        <div class="imgbox">
          ${imgHtml}
          ${dotsHtml}${arrowsHtml}
        </div>
        <div class="info">
          <span class="name">${p.name}</span>
          <span class="price">${p.price} درهم</span>
          <div class="card-actions">
            <button class="share-btn" aria-label="شارك مع صديقة">
              <svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            </button>
            <button class="add-cart-btn" aria-label="أضف للسلة">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            </button>
          </div>
        </div>`;

      card.querySelector('.add-cart-btn').addEventListener('click', () => {
        addToCart({ id: doc.id, name: p.name, price: p.price, image: images[0] || '' });
      });
      card.querySelector('.share-btn').addEventListener('click', () => {
        shareProduct(p.name, p.price);
      });

      if (images.length) {
        let idx = 0;
        const imgEl = card.querySelector('.imgbox img');
        const dots = card.querySelectorAll('.dots span');
        function show(i){
          idx = (i + images.length) % images.length;
          imgEl.src = images[idx];
          dots.forEach((d, j) => d.classList.toggle('on', j === idx));
        }
        const prevBtn = card.querySelector('.arrow.prev');
        const nextBtn = card.querySelector('.arrow.next');
        if (prevBtn) prevBtn.addEventListener('click', e => { e.stopPropagation(); show(idx - 1); });
        if (nextBtn) nextBtn.addEventListener('click', e => { e.stopPropagation(); show(idx + 1); });
        card.querySelector('.imgbox').addEventListener('click', e => {
          if (e.target.closest('.arrow')) return;
          openLightbox(images[idx]);
        });
      }
      gallery.appendChild(card);
    });
  }, err => {
    gallery.innerHTML = '<div class="empty-msg">تعذر تحميل المنتجات، تحققي من الاتصال</div>';
    console.error(err);
  });

  function openLightbox(src){
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
  }
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target.id === 'lightbox') closeLightbox();
  });

  function shareProduct(name, price){
    const siteUrl = 'https://ssinrana0-afk.github.io/';
    const text = `شوفي هاد الجمال 😍 "${name}" بثمن ${price} درهم عند Artmerce ✨\n${siteUrl}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }

  // ===== Shopping cart =====
  function getCart(){
    try{ return JSON.parse(localStorage.getItem('artmerce_cart') || '[]'); }
    catch(e){ return []; }
  }
  function saveCart(cart){
    localStorage.setItem('artmerce_cart', JSON.stringify(cart));
    renderCart();
  }
  function addToCart(product){
    const cart = getCart();
    const existing = cart.find(i => i.id === product.id);
    if(existing){ existing.qty += 1; }
    else{ cart.push({ ...product, qty: 1 }); }
    saveCart(cart);
    openCart();
  }
  function changeQty(id, delta){
    const cart = getCart();
    const item = cart.find(i => i.id === id);
    if(!item) return;
    item.qty += delta;
    if(item.qty <= 0){
      saveCart(cart.filter(i => i.id !== id));
    } else {
      saveCart(cart);
    }
  }
  function removeFromCart(id){
    saveCart(getCart().filter(i => i.id !== id));
  }
  function renderCart(){
    const cart = getCart();
    const itemsEl = document.getElementById('cartItems');
    const badge = document.getElementById('cartBadge');
    const totalCount = cart.reduce((s, i) => s + i.qty, 0);
    badge.textContent = totalCount;
    badge.style.display = totalCount > 0 ? 'flex' : 'none';

    if(cart.length === 0){
      itemsEl.innerHTML = '<div class="cart-empty">السلة فارغة</div>';
    } else {
      itemsEl.innerHTML = cart.map(i => `
        <div class="cart-item">
          ${i.image ? `<img src="${i.image}">` : ''}
          <div class="ci-info">
            <div class="ci-name">${i.name}</div>
            <div class="ci-price">${i.price} درهم</div>
            <span class="cart-remove" onclick="removeFromCart('${i.id}')">إزالة</span>
          </div>
          <div class="cart-qty">
            <button onclick="changeQty('${i.id}', -1)">−</button>
            <span>${i.qty}</span>
            <button onclick="changeQty('${i.id}', 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    const total = cart.reduce((s, i) => s + (parseFloat(i.price) || 0) * i.qty, 0);
    document.getElementById('cartTotal').textContent = total + ' درهم';
  }
  function openCart(){
    renderCart();
    document.getElementById('cartOverlay').classList.add('open');
    document.getElementById('cartDrawer').classList.add('open');
  }
  function closeCart(){
    document.getElementById('cartOverlay').classList.remove('open');
    document.getElementById('cartDrawer').classList.remove('open');
  }
  function checkoutCart(){
    const cart = getCart();
    if(cart.length === 0) return;
    let msg = 'مرحبًا ✨ أريد طلب:%0A%0A';
    cart.forEach(i => {
      msg += `- ${i.name} × ${i.qty} (${i.price} درهم)%0A`;
    });
    const total = cart.reduce((s, i) => s + (parseFloat(i.price) || 0) * i.qty, 0);
    msg += `%0Aالمجموع: ${total} درهم`;
    window.open('https://wa.me/212700105284?text=' + msg, '_blank');
  }
  renderCart();
</script>

</body>
</html>
